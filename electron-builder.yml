appId: com.readingassistant.app
productName: Reading Assistant
copyright: Copyright © 2026 Reading Assistant
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Reading Assistant
  uninstallDisplayName: Reading Assistant
